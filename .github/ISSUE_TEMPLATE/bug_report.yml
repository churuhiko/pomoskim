name: 不具合報告
description: PomodoroOverlayの不具合を報告します
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 個人情報、OAuth認証情報、トークンを添付しないでください。
  - type: input
    id: version
    attributes:
      label: バージョン
      placeholder: v0.3.0-preview.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows環境
      placeholder: Windows 11 Home / 1920x1080 / 拡大率175%
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 不具合が起きるまでの操作を順番に記載してください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true
